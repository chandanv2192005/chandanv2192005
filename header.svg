<svg width="1000" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#000" />
  <style>
    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-2px, 2px); }
      40% { transform: translate(-2px, -2px); }
      60% { transform: translate(2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }
    @keyframes glitch-opacity {
      0% { opacity: 1; }
      1% { opacity: 0.1; }
      2% { opacity: 1; }
      10% { opacity: 1; }
      11% { opacity: 0.5; }
      12% { opacity: 1; }
      100% { opacity: 1; }
    }
    .glitch-text {
      fill: #00FF41;
      font-family: 'Courier New', Courier, monospace;
      font-weight: bold;
      text-anchor: middle;
      animation: glitch 1s infinite linear alternate-reverse, glitch-opacity 3s infinite;
    }
    .main-text { font-size: 48px; }
    .sub-text { font-size: 24px; fill: #00FF41; opacity: 0.8; }
  </style>
  <text x="50%" y="45%" class="glitch-text main-text">3rd YEAR CYBERSECURITY STUDENT</text>
  <text x="50%" y="75%" class="glitch-text sub-text">LEARNING PYTHON, NETWORKING AND JAVA</text>
</svg>
